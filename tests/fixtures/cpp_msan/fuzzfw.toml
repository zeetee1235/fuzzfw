schema_version = 1

[project]
name = "cpp-msan-fixture"
source = "."
compdb = "build/compile_commands.json"

[host]
sanitizers = ["memory"]

[ci]
engine = "replay"
time_seconds = 5
jobs = 1
corpus_dir = "corpus"

[[targets]]
name = "cpp_msan_entry"
symbol = "cpp_msan_entry"
source = "src/msan.cpp"
header = "include/msan.hpp"
required = true
input = "bytes_length"
max_input_bytes = 16
seeds = ["seeds"]
