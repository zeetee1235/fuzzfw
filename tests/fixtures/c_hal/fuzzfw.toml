schema_version = 1

[project]
name = "c-hal-fixture"
source = "."
compdb = "build/compile_commands.json"

[ci]
engine = "replay"
time_seconds = 5
jobs = 1

[[targets]]
name = "sensor_process"
symbol = "sensor_process"
source = "src/sensor.c"
header = "include/sensor.h"
required = true
input = "bytes_length"
max_input_bytes = 128
seeds = ["seeds"]

[[adapters]]
original_symbol = "HAL_GetStatus"
replacement_source = "tests/fuzzfw/adapters/hal_status.c"
contract = "tests/fuzzfw/contracts/hal_status.json"
