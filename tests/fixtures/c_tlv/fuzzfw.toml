schema_version = 1

[project]
name = "c-tlv-fixture"
source = "."
compdb = "build/compile_commands.json"

[ci]
engine = "replay"
time_seconds = 5
jobs = 1

[[targets]]
name = "tlv_frame"
symbol = "tlv_frame"
source = "src/tlv.c"
header = "include/tlv.h"
required = true
input = "length_prefixed"
max_frames = 8
max_input_bytes = 32
seeds = ["seeds"]

[targets.framing]
length_bytes = 2
endian = "big"
includes_header = true
