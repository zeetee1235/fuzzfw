schema_version = 1

[project]
name = "c-overread-fixture"
source = "."
compdb = "build/compile_commands.json"

[ci]
engine = "replay"
time_seconds = 5
jobs = 1
corpus_dir = "corpus"

[[targets]]
name = "read_past"
symbol = "read_past"
source = "src/overread.c"
header = "include/overread.h"
required = true
input = "bytes_length"
max_input_bytes = 32
seeds = ["seeds"]
