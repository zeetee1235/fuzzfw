schema_version = 1

[project]
name = "c-msan-fixture"
source = "."
compdb = "build/compile_commands.json"

[host]
sanitizers = ["memory"]

[ci]
engine = "replay"
time_seconds = 5
jobs = 1
corpus_dir = "corpus"

[[targets]]
name = "read_uninitialized"
symbol = "read_uninitialized"
source = "src/msan.c"
header = "include/msan.h"
required = true
input = "bytes_length"
max_input_bytes = 16
seeds = ["seeds"]
