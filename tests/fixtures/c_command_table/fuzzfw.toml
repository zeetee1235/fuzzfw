schema_version = 1

[project]
name = "c-command-table-fixture"
source = "."
compdb = "build/compile_commands.json"

[ci]
engine = "replay"
time_seconds = 5
jobs = 1

[[targets]]
name = "command_table_entry"
symbol = "command_table_entry"
source = "src/command_table.c"
header = "include/command_table.h"
required = true
input = "bytes_length"
max_input_bytes = 16
command_seeds = true
seeds = ["seeds"]
