schema_version = 1

[project]
name = "c-state-fixture"
source = "."
compdb = "build/compile_commands.json"

[ci]
engine = "replay"
time_seconds = 5
jobs = 1

[[targets]]
name = "stateful"
symbol = "stateful"
source = "src/state.c"
header = "include/state.h"
required = true
setup = "state_setup"
input = "bytes_length"
max_input_bytes = 32
seeds = ["seeds"]
