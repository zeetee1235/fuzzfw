name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out="dist/fuzzfw-${version}-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w \
            -X github.com/fuzzfw/fuzzfw/internal/version.Version=${version} \
            -X github.com/fuzzfw/fuzzfw/internal/version.Commit=${commit} \
            -X github.com/fuzzfw/fuzzfw/internal/version.BuildDate=${date} \
            -X github.com/fuzzfw/fuzzfw/internal/version.Builder=github-actions" \
            -o "$out" ./cmd/fuzzfw
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzzfw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fuzzfw-*-${{ matrix.goos }}-${{ matrix.goarch }}*

  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: fuzzfw-sbom
          path: dist/*.cdx.json

  publish:
    name: Publish release assets
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: find dist -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "fuzzfw $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
