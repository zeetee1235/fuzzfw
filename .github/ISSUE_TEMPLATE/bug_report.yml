name: Bug report
description: Report a reproducible fuzzfw defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include customer firmware, crash inputs, keys, or proprietary logs.
        For security vulnerabilities, follow SECURITY.md instead of opening this issue.
  - type: input
    id: version
    attributes:
      label: fuzzfw version/commit
      placeholder: "0.1.0-dev / abc1234"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `fuzzfw doctor --json` with sensitive paths removed
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: Exact command and a sanitized fuzzfw.toml
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Sanitized diagnostics
      description: Relevant diagnostics.json/summary.json excerpts, no customer data
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, customer firmware, and proprietary crash inputs.
          required: true
        - label: I searched existing issues.
          required: true
